name: Validate Jadval Studio
on:
  push:
    branches: [main]
    paths:
      - index.html
      - demo-generator.js
      - sparse-generator.js
      - mosaic-generator.js
      - classic-patterns.js
      - classic-preview.js
      - bank-tools.js
      - classic-solver-worker.js
      - verified-sample-15.js
      - firebase-config.js
      - cloud-bridge.js
      - cloud-safety.js
      - local-backup.js
      - firebase/firestore.rules
      - import_puzzles.py
      - build_database.py
      - generate.py
      - tools/**
      - tests/**
      - .github/workflows/validate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python importer unit tests
        run: |
          python3 -m py_compile generate.py tools/convert_claude_crossword.py
          python3 -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          if len(scripts)!=1: raise SystemExit(f'Expected 1 inline script, found {len(scripts)}')
          Path('/tmp/jadval-studio.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/jadval-studio.js
          node --check demo-generator.js
          node --check sparse-generator.js
          node --check mosaic-generator.js
          node --check classic-patterns.js
          node --check classic-preview.js
          node --check bank-tools.js
          node --check classic-solver-worker.js
          node --check verified-sample-15.js
          node --check firebase-config.js
          node --check cloud-bridge.js
          node --check cloud-safety.js
          node --check local-backup.js
          node --test tests/test_cloud_safety.cjs
          node tests/test_cloud_bridge.cjs
          node tests/test_verified_sample_15.cjs
          node tests/test_classic_solver.cjs
          node tests/test_classic_patterns.cjs
          node tests/test_demo_generator.cjs
          node tests/test_sparse_generator.cjs
          node tests/test_mosaic_generator.cjs


  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test dependencies
        run: npm install --no-save --package-lock=false firebase-tools@14.19.1 firebase@12.19.0 @firebase/rules-unit-testing@5.0.0
      - name: Private rules and two-client version tests
        run: npx firebase emulators:exec --only firestore --project demo-jadval-private 'node tests/test_firestore_rules.cjs'
