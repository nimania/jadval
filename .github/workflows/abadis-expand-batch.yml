name: One-time bounded Abadis clue-answer harvest
on:
  push:
    branches: [abadis-safe-import]
    paths:
      - .github/workflows/abadis-expand-batch.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harvest:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install --quiet beautifulsoup4
      - name: Verify extraction code
        run: python -m py_compile tools/abadis_expand_batch.py
      - name: Harvest strict crossword sections with robots controls
        run: python tools/abadis_expand_batch.py --group ${{ matrix.shard }} --per-letter 30 --delay 1.7 --out abadis-harvest-${{ matrix.shard }}.json
      - name: Keep attributed candidate data as short-lived artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abadis-harvest-${{ matrix.shard }}
          path: abadis-harvest-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: ignore
