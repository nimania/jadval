name: Publish Jadval Studio UI
on:
  push:
    branches: [main]
    paths: [index.html, demo-generator.js, sparse-generator.js, mosaic-generator.js, classic-patterns.js, classic-preview.js, bank-tools.js, classic-solver-worker.js, verified-sample-15.js, firebase-config.js, cloud-bridge.js, cloud-safety.js, local-backup.js, publish.js, quality-gate.js, bank-readiness.js, metrics.js, bank-metrics.js, bank-migration-stage.js, studio-novelty.js, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jadval-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only the public UI (never upload the question bank)
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp demo-generator.js public/demo-generator.js
          cp sparse-generator.js public/sparse-generator.js
          cp mosaic-generator.js public/mosaic-generator.js
          cp classic-patterns.js public/classic-patterns.js
          cp classic-preview.js public/classic-preview.js
          cp bank-tools.js public/bank-tools.js
          cp classic-solver-worker.js public/classic-solver-worker.js
          cp verified-sample-15.js public/verified-sample-15.js
          cp firebase-config.js public/firebase-config.js
          cp cloud-bridge.js public/cloud-bridge.js
          cp cloud-safety.js public/cloud-safety.js
          cp local-backup.js public/local-backup.js
          cp publish.js public/publish.js
          cp quality-gate.js public/quality-gate.js
          cp bank-readiness.js public/bank-readiness.js
          cp metrics.js public/metrics.js
          cp bank-metrics.js public/bank-metrics.js
          cp bank-migration-stage.js public/bank-migration-stage.js
          cp studio-novelty.js public/studio-novelty.js
          echo 'User-managed private data is not hosted here.' > public/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

