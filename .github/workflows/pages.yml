name: Publish Jadval Studio UI
on:
  push:
    branches: [main]
    paths: [index.html, demo-generator.js, sparse-generator.js, mosaic-generator.js, classic-patterns.js, classic-preview.js, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jadval-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only the public UI (never upload the question bank)
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp demo-generator.js public/demo-generator.js
          cp sparse-generator.js public/sparse-generator.js
          cp mosaic-generator.js public/mosaic-generator.js
          cp classic-patterns.js public/classic-patterns.js
          cp classic-preview.js public/classic-preview.js
          echo 'User-managed private data is not hosted here.' > public/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
