name: Abadis full-page crawl — checkpointed batch
on:
  push:
    branches: [abadis-safe-import]
    paths: [tools/abadis-full-cursor.json]
  workflow_dispatch:
    inputs:
      letter:
        description: 'One Persian starting letter'
        required: true
        default: 'ا'
        type: string
      page:
        description: 'Index page from previous next_cursor'
        required: true
        default: '1'
        type: string
      offset:
        description: 'Next item number, 0 to 49'
        required: true
        default: '0'
        type: string
      max_details:
        description: 'Bounded requests 1..150'
        required: true
        default: '60'
        type: string
permissions:
  contents: read
concurrency:
  group: abadis-full-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install -q beautifulsoup4
      - name: Verify Python syntax
        run: python -m py_compile tools/abadis_expand_batch.py tools/abadis_full_scan.py tools/abadis_sprint.py tools/abadis_prepare_import.py
      - name: Check source structure before harvesting
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from abadis_expand_batch import fetch,section_answers
          answers,error=section_answers(fetch('https://abadis.ir/fatofa/خا/',2.0))
          if error or 'دوش' not in answers:raise SystemExit('Source HTML changed, refusing harvest')
          PY
      - name: Resolve exact cursor parameters
        env:
          LETTER_INPUT: ${{ inputs.letter }}
          PAGE_INPUT: ${{ inputs.page }}
          OFFSET_INPUT: ${{ inputs.offset }}
          DETAILS_INPUT: ${{ inputs.max_details }}
        run: |
          python - <<'PY'
          import json,os
          if os.environ['GITHUB_EVENT_NAME']=='push':
              c=json.load(open('tools/abadis-full-cursor.json',encoding='utf8'))
          else:
              c={'letter':os.environ['LETTER_INPUT'],'page':int(os.environ['PAGE_INPUT']),
                 'offset':int(os.environ['OFFSET_INPUT']),
                 'max_details':int(os.environ['DETAILS_INPUT'])}
          assert len(c['letter'])==1 and 1<=int(c['page'])<=20000
          assert 0<=int(c['offset'])<50 and 1<=int(c['max_details'])<=150
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as f:
              for key,val in [('AB_LETTER',c['letter']),('AB_PAGE',c['page']),
                              ('AB_OFFSET',c['offset']),('AB_DETAILS',c['max_details'])]:
                  f.write(f'{key}={val}\n')
          PY
      - name: Sequential multi-letter sprint within one 150-detail budget
        run: |
          python tools/abadis_sprint.py --letter "$AB_LETTER" --page "$AB_PAGE" --offset "$AB_OFFSET" --max-pages 8 --max-letters 8 --max-details "$AB_DETAILS" --delay 2.0 --out abadis-full-results.json
      - name: Save candidate data and next cursor, never private bank
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abadis-full-${{ github.run_id }}
          path: abadis-full-results.json
          retention-days: 7
          if-no-files-found: ignore
