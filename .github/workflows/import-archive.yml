name: Import licensed crossword archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch source puzzle files
        run: python3 fetch_archive.py --output archive/raw
      - name: Build independent SQLite bank
        run: python3 build_database.py --archive archive/raw --db archive/jadval.sqlite --report archive/report.json
      - name: Upload private working archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jadval-import-${{ github.run_number }}
          path: archive/
          retention-days: 30
          if-no-files-found: error
