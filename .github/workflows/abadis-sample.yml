name: Sample Abadis crossword candidates (unreviewed)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check script compiles
        run: python -m py_compile tools/abadis_sample.py
      - name: Collect modest sample of four alphabets
        run: python tools/abadis_sample.py --letters 'ا,ب,م,ی' --per-letter 20 --delay 1.3 --out abadis-sample.json
      - name: Hold candidate data as temporary workflow artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abadis-sample-unreviewed
          path: abadis-sample.json
          if-no-files-found: ignore
          retention-days: 1
